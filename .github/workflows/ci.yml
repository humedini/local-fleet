# Unit tests on every supported Python (they include the manifest/catalog consistency checks), a
# syntax check of the Desktop half, and Hermes's own catalog checks (validate + doctor) against a
# pinned Hermes. Hermes only supports editable installs, so it is checked out at that commit.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "httpx>=0.27,<1" "pyyaml>=6,<7" "pytest>=8,<10" "respx>=0.21,<1" "fastapi>=0.110,<1"
      - run: python -m pytest tests -q

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - name: plugin.js parses as an ES module and uses no JSX syntax
        run: |
          cp desktop/plugin.js /tmp/plugin.mjs && node --check /tmp/plugin.mjs
          ! grep -nE "return <|=> <[A-Za-z]" desktop/plugin.js
  hermes:
    runs-on: ubuntu-latest
    env:
      HERMES_REF: b200f5bc60e31588ba2cb60e288029c4a54ba5fa  # Hermes 0.22.7, the version this release was built against
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: local-fleet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ./hermes-agent
      - name: hermes plugins validate
        run: HERMES_HOME="$RUNNER_TEMP/hh" hermes plugins validate local-fleet --install-deps
      - name: hermes plugins doctor
        run: HERMES_HOME="$RUNNER_TEMP/hh" hermes plugins doctor local-fleet --ci
