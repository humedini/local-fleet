# Unit tests on every supported Python, a syntax check of the Desktop half, and a manifest sanity
# check. `hermes plugins validate . --install-deps` and `hermes plugins doctor . --ci` need a Hermes
# install and run locally before each release (see README, Develop).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "httpx>=0.27,<1" "pyyaml>=6,<7" "pytest>=8,<10" "respx>=0.21,<1" "fastapi>=0.110,<1"
      - run: python -m pytest tests -q
      - name: manifest declares what register() provides
        run: |
          python - <<'PY'
          import yaml
          m = yaml.safe_load(open("plugin.yaml"))
          assert m["name"] == "hermes-spark" and m["manifest_version"] == 2
          assert sorted(m["provides_tools"]) == ["spark_list_nodes", "spark_pull_model", "spark_status"]
          assert m["provides_hooks"] == ["on_session_start"]
          for k, v in m["config_schema"].items():
              assert v["type"] in ("str", "int", "float", "bool", "list"), k
          print("plugin.yaml ok, version", m["version"])
          PY
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: plugin.js parses as an ES module and uses no JSX syntax
        run: |
          cp desktop/plugin.js /tmp/plugin.mjs && node --check /tmp/plugin.mjs
          ! grep -nE "return <|=> <[A-Za-z]" desktop/plugin.js
