# plugin-catalog/local-fleet.yaml for the catalog PR: pinned to the v0.1.0 tag. Copy this file into
# NousResearch/hermes-agent's plugin-catalog/ once the repo is public.
name: local-fleet
repo: https://github.com/humedini/local-fleet
sha: 03701af55641168f4c05b7760258fc2324d373f3
title: Local Fleet
description: 'Health-aware routing across your own inference boxes (DGX Spark / GB10, Ollama, vLLM, LiteLLM, and
  clusters behind one endpoint). Probes each box, makes the least busy healthy one the primary model, falls back to
  smaller models on smaller boxes, then to your cloud model, and switches back when a box recovers. Optional:
  subagents spread across boxes (delegation backend fleet), side tasks on the fleet (auxiliary.*), keep the routed
  model loaded, speed benches. CLI hermes fleet, /fleet, Desktop chip and fleet page. Writes model.*,
  fallback_providers, and on request delegation.backend and auxiliary.<task>; hermes fleet restore puts the primary
  back. Network: HTTP only to the boxes you register (health, a 64-token bench, model load/keep-alive, optional
  pull). Observer hooks record per-call endpoint, model, tokens and duration (never content) in its data dir.
  Read-only tools plus an Ollama-only model pull; no remote command execution.'
maintainer: humedini
tier: community
category: models
version: "0.1.0"
requires_hermes: ">=0.22"
docs_url: https://github.com/humedini/local-fleet#readme
readme: true
image: https://raw.githubusercontent.com/humedini/local-fleet/03701af55641168f4c05b7760258fc2324d373f3/docs/img/fleet-page.png
screenshots:
  - https://raw.githubusercontent.com/humedini/local-fleet/03701af55641168f4c05b7760258fc2324d373f3/docs/img/fleet-map.gif
  - https://raw.githubusercontent.com/humedini/local-fleet/03701af55641168f4c05b7760258fc2324d373f3/docs/img/fleet-chip.png
platforms: []
capabilities:
  provides_tools: [fleet_status, fleet_list_nodes, fleet_pull_model]
  provides_hooks: [on_session_start, post_api_request, api_request_error, post_auxiliary_call]
  provides_middleware: []
  requires_env: []
