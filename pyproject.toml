[project]
name = "local-fleet"
version = "0.2.0"
description = "Health-aware routing for Hermes across your own inference boxes, with cloud failover"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "respx>=0.21,<1", "pyyaml>=6,<7", "fastapi>=0.110,<1"]
