name: local-fleet
version: 0.3.1
manifest_version: 2
api_version: 1
description: Local inference fleet for Hermes (DGX Spark, Ollama, vLLM, LiteLLM) — health probes, freest-box routing, prefer-local / prefer-cloud / auto, cloud failover and failback, Desktop chip and /fleet
author: Jonathan Hume
license: MIT
homepage: https://github.com/humedini/local-fleet
tags: [local, fleet, ollama, vllm, litellm, routing, failover, desktop, dgx-spark]
requires_hermes: ">=0.22"

provides_tools:
  - fleet_status
  - fleet_list_nodes
  - fleet_pull_model

provides_hooks:
  - on_session_start
  - post_api_request
  - api_request_error
  - post_auxiliary_call

python_dependencies:
  - "httpx>=0.27,<1"

config_keys:
  - model.provider
  - model.default
  - model.base_url
  - model.api_mode
  - model.key_env
  - delegation.backend
  - auxiliary.title_generation
  - auxiliary.compression
  - auxiliary.vision
  - auxiliary.approval

config_schema:
  mode:
    type: str
    choices: [prefer-local, prefer-cloud, auto]
    default: auto
    label: Routing mode
    description: "prefer-local: the least busy box, cloud when every box is down. prefer-cloud: cloud, with boxes on request. auto: a box when one is up, else cloud, back to a box when one recovers."
  cloud_provider:
    type: str
    default: openrouter
    label: Cloud provider
    description: Hermes provider id used for prefer-cloud and failover; also kept on fallback_providers
  cloud_model:
    type: str
    default: ""
    label: Cloud model
    description: Model id on the cloud provider
  default_model:
    type: str
    default: ""
    label: Local model
    description: Model id to run on local nodes; nodes without it are skipped. Empty picks one per node.
  fallback_models:
    type: list
    default: []
    label: Fallback models
    description: Lower-tier local models, in order, used on boxes without the main model when no box has it (e.g. ["qwen3:14b"])
  min_context:
    type: int
    default: 32768
    label: Minimum context (tokens)
    description: A box whose model is verified to run with a smaller context is not chosen (Hermes's system prompt alone is ~15k tokens)
  probe_timeout_s:
    type: float
    default: 2.0
    label: Probe timeout (s)
  probe_interval_s:
    type: float
    default: 30.0
    label: Watch interval (s)
  failback_enabled:
    type: bool
    default: true
    label: Fail back to local when a box recovers
  switch_margin:
    type: float
    default: 0.25
    label: Switch margin
    description: How much freer (0..1 load) another box must be before a healthy active box is swapped out
  bench_interval_s:
    type: float
    default: 900.0
    label: Bench interval (s)
    description: How often watch / session start / the Desktop re-measure tokens/sec per box; 0 = only on request
  warm_before_switch:
    type: bool
    default: true
    label: Load the model before switching to a box
  warm_timeout_s:
    type: float
    default: 120.0
    label: Warm-up timeout (s)
  keep_loaded:
    type: bool
    default: false
    label: Keep the routed model loaded
    description: While Hermes is routed to an Ollama box, keep its model in memory (no cold load after idle time)
  private_only:
    type: bool
    default: false
    label: Private inference
    description: Keep Hermes's model calls (primary, fallback_providers, side tasks, subagents) on your registered boxes and fail rather than use cloud. Turn on with hermes fleet private on, which applies it and reports anything not in force; setting this value alone applies nothing. Not air-gapping - tools may still use the internet.
  hide_addresses:
    type: bool
    default: false
    label: Hide box addresses
    description: Show display names only, no URLs or IPs, in the Desktop and terminal (for screen recordings)
  aux_tasks:
    type: list
    default: []
    label: Side tasks on the fleet
    description: Auxiliary tasks run on the least busy box, e.g. ["title_generation", "compression"]; set with hermes fleet aux on
  price_in_per_m:
    type: float
    default: 0.0
    label: Cloud input price per million tokens
  price_out_per_m:
    type: float
    default: 0.0
    label: Cloud output price per million tokens
  price_model:
    type: str
    default: ""
    label: Cloud model the prices are for
    description: provider/model, recorded by hermes fleet price (--model); the baseline shown with spend avoided
  currency:
    type: str
    default: "USD"
    label: Currency for spend avoided
    description: ISO 4217 code (GBP, EUR, USD, JPY, …); prices are in this currency and the Desktop formats them in your locale
  prefer_labels:
    type: list
    default: []
    label: Preferred labels
    description: Node labels that win ties on load, e.g. ["lan"]
