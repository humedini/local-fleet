<!doctype html><html><head><meta charset="utf-8"><title>Local Fleet screenshots</title>
<style>
:root{--ui-text-primary:#ececee;--ui-text-secondary:#b6b6bd;--ui-text-tertiary:#8b8b94;--ui-text-quaternary:#5d5d66;
--ui-stroke-secondary:#34343b;--ui-stroke-tertiary:#26262c;--ui-bg-tertiary:#1b1b20;--ui-bg-secondary:#141418;--ui-bg-elevated:#202026;
--ui-green:#3fb950;--ui-orange:#df6500;--ui-red:#e5484d;--ui-row-active-background:#1d2330}
html,body{margin:0;background:#0d0d10;color:var(--ui-text-primary);font:14px/1.4 Inter,system-ui,sans-serif}
.btn{border-radius:6px;border:1px solid #3a3a42;background:#2f6fe0;color:#fff;font:12px system-ui;padding:5px 12px;cursor:pointer}
.btn.outline,.btn.ghost{background:transparent;color:var(--ui-text-primary)}
.btn.micro{padding:2px 8px;font-size:11px;border:0}
.pop{border:1px solid var(--ui-stroke-secondary);border-radius:10px;background:#18181d;width:288px;padding:8px;box-shadow:0 18px 50px #0008}
.chip-stage{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding:20px 16px 0;width:380px}
.pop-wrap{display:flex;flex-direction:column-reverse;align-items:flex-end;gap:10px}
.bar{display:flex;justify-content:flex-end;gap:18px;align-items:center;background:#0a0a0c;border-top:1px solid #222;color:#8b8b94;font-size:11px;padding:4px 14px;margin-top:10px;width:100%;box-sizing:border-box}
</style>
<script type="importmap">{"imports":{"react":"https://esm.sh/react@18.3.1","react/jsx-runtime":"https://esm.sh/react@18.3.1/jsx-runtime",
"react-dom/client":"https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1","@hermes/plugin-sdk":"./sdk-stub.js"}}</script>
</head><body><div id="root"></div>
<script type="module">
import plugin from './plugin.js'
import { createRoot } from 'react-dom/client'
import { createElement as h } from 'react'
const status = await (await fetch('./demo-status.json')).json()
const regs = []
plugin.register({ register: r => regs.push(r), onDispose() {}, rest: async () => status })
const view = new URLSearchParams(location.search).get('view') || 'page'
const root = createRoot(document.getElementById('root'))
if (view === 'chip') {
  const chip = regs.find(r => r.area === 'statusBar.right')
  root.render(h('div', { className: 'chip-stage' }, chip.render(),
    h('div', { className: 'bar' }, h('span', null, 'Backend ready'), h('span', null, '·'), h('span', null, 'client v0.22.7'))))
} else {
  root.render(regs.find(r => r.area === 'routes').render())
}
</script></body></html>
